<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookbook · page development</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,40px);background:#eee9df;color:#302e28;font:17px/1.5 Georgia,serif}header{max-width:1000px;margin-bottom:24px}h1{font-size:2rem;margin:0}h2{font-size:1.1rem;margin:0 0 6px}a{color:#365e49}nav{display:flex;gap:18px;flex-wrap:wrap;font:14px system-ui;margin:10px 0}label,select{font:14px system-ui}select{padding:8px;border:1px solid #b8b2a5;border-radius:5px;background:#fffdf7;max-width:100%}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px;align-items:start}#cards.chosen{grid-template-columns:repeat(var(--columns),minmax(0,1fr))}article{min-width:0;background:#fffdf7;padding:12px;border:1px solid #d6d0c4;border-radius:7px}article p{font-size:14px;margin:8px 0}article img{display:block;width:100%;height:auto;background:#faf8f1;margin:12px 0}article label{display:block}article select{display:block;width:100%;margin-top:4px}.links{display:flex;gap:14px;flex-wrap:wrap;font:14px system-ui}@media(max-width:650px){#cards.chosen{grid-template-columns:1fr}}
</style>
<header><h1>Cookbook · page development</h1><p>Representative artwork carries the major compositional ideas. The guide records the feedback and final direction.</p><nav><a href="/cookbook-stations/">Finished pages</a><a href="/cookbook-study/contact-sheets/">Art directions</a><a href="/cookbook-hotspots/">Stations</a><a href="/cookbook-backgrounds/">Page development</a><a href="/combinations.html?story=cookbook/cookbook.md">Play Cookbook</a></nav><label>Columns <select id="columns"><option value="auto">Fit window</option><option>2</option><option>3</option><option>4</option></select></label></header><main id="cards"></main>
<script type="module">
const cards=[{"title":"Botanical notebook","description":"Attractive but repetitive. Chapter themes needed more variety.","views":[{"label":"Early grain ground","file":"/projects/cookbook-study/cookbook/production/artwork/background-grain.png"}]},{"title":"Pastry as separate objects","description":"Too close to draggable ingredients. A spread needs setting and relationships.","views":[{"label":"Earlier painting","file":"/projects/cookbook-study/backgrounds/sources/superseded/butter-between-the-layers-isolated.png"},{"label":"Approved pastry page","file":"/projects/cookbook-study/page-composition/images/butter-between-the-layers.png"}]},{"title":"Ravioli as a spread","description":"Bowl, fork, herbs and crumbs establish a setting. The final composition is shallower.","views":[{"label":"Earlier finished painting","file":"/projects/cookbook-study/backgrounds/sources/ribbons-and-ravioli.png"},{"label":"Current page","file":"/projects/cookbook-study/pencil-stations/production/backgrounds/ribbons-and-ravioli.png"}]},{"title":"Salad and the page","description":"A successful spread, with natural variation in height.","views":[{"label":"Earlier finished painting","file":"/projects/cookbook-study/backgrounds/sources/leaves-mustard-and-crunch.png"},{"label":"Approved painting","file":"/projects/cookbook-study/page-composition/images/leaves-mustard-and-crunch.png"}]},{"title":"Scones for tea","description":"One of the three approved previews: faint top motifs and a shallow spread bleeding into the bottom.","views":[{"label":"Approved painting","file":"/projects/cookbook-study/page-composition/images/scones-jam-and-cream.png"}]}];
const main=document.querySelector('#cards');
for(const card of cards){
 const article=document.createElement('article'),heading=document.createElement('h2'),copy=document.createElement('p'),label=document.createElement('label'),select=document.createElement('select'),image=document.createElement('img'),links=document.createElement('div'),original=document.createElement('a');
 heading.textContent=card.title;copy.textContent=card.description??'';label.textContent='Artwork view';image.alt=card.title;image.loading='lazy';original.textContent='Open PNG';links.className='links';
 for(const view of card.views){const option=document.createElement('option');option.textContent=view.label;option.value=view.file;select.append(option);}
 const show=()=>{image.src=select.value;original.href=select.value;};select.addEventListener('change',show);show();label.append(select);links.append(original);
 if(card.play){const a=document.createElement('a');a.href=card.play;a.textContent='Open chapter';links.append(a);}
 article.append(heading,copy,label,image,links);main.append(article);
}
document.querySelector('#columns').addEventListener('change',event=>{main.classList.toggle('chosen',event.target.value!=='auto');main.style.setProperty('--columns',event.target.value);});
window.galleryReady=true;
</script></html>
