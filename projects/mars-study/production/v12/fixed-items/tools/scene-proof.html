<!doctype html><html><head><link rel="stylesheet" href="/src/web/style.css"><link rel="stylesheet" href="/src/web/item-artwork.css"><style>html,body{margin:0;width:390px;height:844px;overflow:hidden}#audit{position:relative;width:390px;height:844px;isolation:isolate}.chapter-panel{position:relative!important;width:390px;height:844px;overflow:hidden}.audit-bg{position:absolute;left:0;top:0;width:390px;height:844px;z-index:-1}.icon-name{display:none!important}</style></head><body><div id="audit"></div><script type="module">
import{parseStory}from'/src/story/parser.ts';import{activeHotspots,hotspotDefinition}from'/src/engine/fixed-items.ts';import{itemPresentation}from'/src/engine/presentation.ts';import{ItemArtwork}from'/src/web/item-artwork.ts';import{hotspotHTML}from'/src/web/hotspot-view.ts';
const url='/projects/mars-study/mars-v12/mars.md',story=parseStory(await(await fetch(url)).text());const art=new ItemArtwork(),asset=p=>new URL(p,new URL(url,location.href)).href;window.auditStory=story;
window.auditScene=async(ch,only,filled=false)=>{const c=story.chapters[ch];let bg=c.image;for(let k=ch-1;!bg&&k>=0;k--)bg=story.chapters[k].image;const ids=activeHotspots(story,ch).filter(id=>only==='all'||id===only);const specs=ids.map(id=>{const d=hotspotDefinition(story,ch,id),p=itemPresentation(story,ch,id);return {...d,name:p.name,icon:d.icon??p.icon}});await art.prepare(specs.flatMap(h=>[h.icon?.url,...(filled?story.items[h.id].slots.map(s=>s.icon?.url):[])]).filter(Boolean),asset);const html=specs.map(h=>{const item=story.items[h.id],v=art.visual(item,filled?(Array.isArray(filled)?filled:item.slots.map(s=>s.accepts)):[],id=>itemPresentation(story,ch,id).name,asset,undefined,h.icon,true);return hotspotHTML(h,activeHotspots(story,ch).indexOf(h.id),{...v,className:v.icon?v.className.replace('icon-thing','hotspot-icon').replace('icon-circular','hotspot-circular'):''})}).join('');document.getElementById('audit').innerHTML=`<section class="chapter-panel"><img class="audit-bg" src="${asset(bg)}">${html}</section>`;await Promise.all([...document.images].map(i=>i.decode()));return specs.map(h=>({id:h.id,name:h.name,x:h.x,y:h.y,url:h.icon?.url}));};
window.auditReady=true;
</script></body></html>
